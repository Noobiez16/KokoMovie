name: Electron Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  quality:
    name: Quality and security boundaries
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install locked dependencies
        run: npm ci
      - name: Verify release versions and changelog
        run: node scripts/verify-release-version.mjs
      - name: Lint
        run: npm run lint
      - name: Typecheck renderer, main process and Electron tests
        run: npm run typecheck
      - name: Deterministic tests
        run: npm test
      - name: Production dependency audit policy
        run: npm run audit:production
      # Vendor FFmpeg first: the licence gate verifies the recorded provenance of every LGPL
      # build present, and a release must never ship a GPL-configured binary.
      - name: Vendor pinned LGPL FFmpeg for Linux and Windows
        run: npm run vendor:ffmpeg --workspace=client -- linux-x64 linux-arm64 win32-x64 --source
      - name: Distribution licence gate
        run: npm run check:licenses -- --report
      - name: Publish checksum-verified official FFmpeg source for Mac runners
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-official-source
          path: client/vendor/ffmpeg/source/ffmpeg-8.1.2.tar.xz
          if-no-files-found: error
          retention-days: 3
      - name: Production build
        run: npm run build
      - name: Verify Electron runtime fuses
        run: npm run verify:fuses --workspace=client

  electron-e2e:
    name: Real Electron security boundaries
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install locked dependencies
        run: npm ci
      - name: Vendor LGPL FFmpeg for media playback tests
        run: npm run vendor:ffmpeg --workspace=client -- linux-x64
      - name: Production build
        run: npm run build --workspace=client
      - name: Install X11 window manager for native fullscreen tests
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y openbox x11-utils
      - name: Real Electron security boundary tests
        shell: bash
        run: |
          xvfb-run -a --server-args="-screen 0 3840x2160x24" bash -euo pipefail <<'EOF'
          openbox --sm-disable >"$RUNNER_TEMP/kokomovie-openbox.log" 2>&1 &
          wm_pid=$!
          trap 'kill "$wm_pid" 2>/dev/null || true' EXIT
          for attempt in {1..50}; do
            if LC_ALL=C xprop -root _NET_SUPPORTING_WM_CHECK | grep -q 'window id'; then
              npm run test:e2e --workspace=client
              exit 0
            fi
            sleep 0.2
          done
          cat "$RUNNER_TEMP/kokomovie-openbox.log"
          printf '%s\n' 'X11 window manager did not become ready.' >&2
          exit 1
          EOF
        env:
          DEBUG: pw:browser

  # ─── Linux: native x64 + ARM64 AppImage/.deb builds ─────────────────────────────────────────────────
  build-linux:
    name: Build Linux (${{ matrix.arch }})
    needs: [quality, electron-e2e]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify native runner architecture
        shell: bash
        run: |
          test "$(node -p 'process.arch')" = "${{ matrix.arch }}"
          uname -m

      - name: Build renderer + main process
        run: npm run build --workspace=client

      - name: Vendor LGPL FFmpeg
        run: npm run vendor:ffmpeg --workspace=client -- linux-${{ matrix.arch }}

      - name: Rebuild native modules
        run: npm run rebuild:native --workspace=client -- --arch=${{ matrix.arch }}

      # Each shipped native binary is named explicitly. A glob would silently stop covering a
      # dependency that changes how it distributes its binary — better-sqlite3 v13 moved from
      # build/Release/ to ABI-stable N-API prebuilds/, and FFmpeg moved out of node_modules
      # entirely when the GPL ffmpeg-static dependency was replaced.
      - name: Verify native binaries
        shell: bash
        run: |
          set -euo pipefail
          expected="x86-64"
          if [ "${{ matrix.arch }}" = "arm64" ]; then expected="ARM aarch64"; fi
          : > native-builds.txt
          for binary in \
            "node_modules/keytar/build/Release/keytar.node" \
            "node_modules/better-sqlite3/prebuilds/linux-${{ matrix.arch }}.node" \
            "client/vendor/ffmpeg/linux-${{ matrix.arch }}/ffmpeg" ; do
            test -f "$binary" || { echo "Missing native binary: $binary"; exit 1; }
            file "$binary" | tee -a native-builds.txt
          done
          test "$(wc -l < native-builds.txt)" -eq 3
          test "$(grep -c "$expected" native-builds.txt)" -eq 3

      - name: Verify FFmpeg is an LGPL build
        shell: bash
        run: |
          set -euo pipefail
          dir="client/vendor/ffmpeg/linux-${{ matrix.arch }}"
          test -f "$dir/LICENSE.txt"
          test -f "$dir/PROVENANCE.json"
          grep -q "LESSER GENERAL PUBLIC LICENSE" "$dir/LICENSE.txt"
          # The configure line is embedded in the binary, so this holds for cross-architecture
          # builds that cannot be executed on this runner.
          for flag in --enable-gpl --enable-nonfree --enable-libx264 --enable-libx265; do
            if grep -aqF -- "$flag" "$dir/ffmpeg"; then
              echo "FFmpeg was configured with $flag; only LGPL builds may ship."; exit 1
            fi
          done

      # Stage the complete app on ARM so architecture selection, ASAR packing, native modules,
      # Electron, and extra resources cross the job boundary as one immutable unit.
      - name: Stage complete Linux ARM64 application
        if: matrix.arch == 'arm64'
        run: npx electron-builder --config electron-builder.linux.yml --linux dir --arm64 --publish never
        working-directory: client

      - name: Verify staged Linux ARM64 application
        if: matrix.arch == 'arm64'
        shell: bash
        run: |
          set -euo pipefail
          app_dir="client/release/linux/linux-arm64-unpacked"
          : > staged-native.txt
          for binary in \
            "$app_dir/kokomovie-client" \
            "$app_dir/resources/ffmpeg/ffmpeg" \
            "$app_dir/resources/app.asar.unpacked/node_modules/keytar/build/Release/keytar.node" \
            "$app_dir/resources/app.asar.unpacked/node_modules/better-sqlite3/prebuilds/linux-arm64.node" ; do
            test -f "$binary" || { echo "Missing staged binary: $binary"; exit 1; }
            file "$binary" | tee -a staged-native.txt
          done
          test "$(wc -l < staged-native.txt)" -eq 4
          test "$(grep -c 'ARM aarch64' staged-native.txt)" -eq 4
          test -f "$app_dir/resources/ffmpeg/LICENSE.txt"
          test -f "$app_dir/resources/ffmpeg/PROVENANCE.json"

      - name: Archive staged Linux ARM64 application
        if: matrix.arch == 'arm64'
        shell: bash
        run: tar -C client/release/linux -czf linux-arm64-unpacked.tar.gz linux-arm64-unpacked

      - name: Upload staged Linux ARM64 application
        if: matrix.arch == 'arm64'
        uses: actions/upload-artifact@v4
        with:
          name: linux-staged-arm64
          path: linux-arm64-unpacked.tar.gz
          retention-days: 1

      - name: Package Linux (.AppImage + .deb)
        if: matrix.arch == 'x64'
        run: npx electron-builder --config electron-builder.linux.yml --linux --${{ matrix.arch }} --publish never
        working-directory: client

      - name: Verify packaged native architecture
        if: matrix.arch == 'x64'
        shell: bash
        run: |
          set -euo pipefail
          app_dir="client/release/linux/linux-unpacked"
          : > packaged-native.txt
          for binary in \
            "$app_dir/kokomovie-client" \
            "$app_dir/resources/ffmpeg/ffmpeg" \
            "$app_dir/resources/app.asar.unpacked/node_modules/keytar/build/Release/keytar.node" \
            "$app_dir/resources/app.asar.unpacked/node_modules/better-sqlite3/prebuilds/linux-x64.node" ; do
            test -f "$binary" || { echo "Missing packaged binary: $binary"; exit 1; }
            file "$binary" | tee -a packaged-native.txt
          done
          test "$(wc -l < packaged-native.txt)" -eq 4
          test "$(grep -c 'x86-64' packaged-native.txt)" -eq 4

      - name: Verify packaged LGPL compliance artifacts
        if: matrix.arch == 'x64'
        shell: bash
        run: |
          set -euo pipefail
          dir="client/release/linux/linux-unpacked/resources/ffmpeg"
          test -f "$dir/LICENSE.txt"
          test -f "$dir/PROVENANCE.json"
          "$dir/ffmpeg" -version | head -1
          "$dir/ffmpeg" -hide_banner -encoders | grep -qw aac
          for flag in --enable-gpl --enable-nonfree --enable-libx264 --enable-libx265; do
            if "$dir/ffmpeg" -version | grep -qF -- "$flag"; then
              echo "Packaged FFmpeg was configured with $flag."; exit 1
            fi
          done

      - name: Upload Linux artifacts
        if: matrix.arch == 'x64'
        uses: actions/upload-artifact@v4
        with:
          name: linux-release-${{ matrix.arch }}
          path: |
            client/release/linux/*.AppImage
            client/release/linux/*.deb
            client/release/linux/latest-linux*.yml
            client/release/linux/*.blockmap
          retention-days: 1

  package-linux-arm64:
    name: Package Linux (arm64)
    needs: build-linux
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build renderer + main process
        run: npm run build --workspace=client

      - name: Download staged Linux ARM64 application
        uses: actions/download-artifact@v4
        with:
          name: linux-staged-arm64

      - name: Restore and verify staged Linux ARM64 application
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p client/release/linux
          tar -C client/release/linux -xzf linux-arm64-unpacked.tar.gz
          app_dir="client/release/linux/linux-arm64-unpacked"
          : > staged-native.txt
          for binary in \
            "$app_dir/kokomovie-client" \
            "$app_dir/resources/ffmpeg/ffmpeg" \
            "$app_dir/resources/app.asar.unpacked/node_modules/keytar/build/Release/keytar.node" \
            "$app_dir/resources/app.asar.unpacked/node_modules/better-sqlite3/prebuilds/linux-arm64.node" ; do
            test -f "$binary" || { echo "Missing staged binary: $binary"; exit 1; }
            file "$binary" | tee -a staged-native.txt
          done
          test "$(wc -l < staged-native.txt)" -eq 4
          test "$(grep -c 'ARM aarch64' staged-native.txt)" -eq 4

      - name: Package Linux ARM64 (.AppImage + .deb)
        run: npx electron-builder --config electron-builder.linux.yml --prepackaged release/linux/linux-arm64-unpacked --linux AppImage deb --arm64 --publish never
        working-directory: client

      - name: Verify packaged native architecture
        shell: bash
        run: |
          set -euo pipefail
          app_dir="client/release/linux/linux-arm64-unpacked"
          : > packaged-native.txt
          for binary in \
            "$app_dir/kokomovie-client" \
            "$app_dir/resources/ffmpeg/ffmpeg" \
            "$app_dir/resources/app.asar.unpacked/node_modules/keytar/build/Release/keytar.node" \
            "$app_dir/resources/app.asar.unpacked/node_modules/better-sqlite3/prebuilds/linux-arm64.node" ; do
            test -f "$binary" || { echo "Missing packaged binary: $binary"; exit 1; }
            file "$binary" | tee -a packaged-native.txt
          done
          test "$(wc -l < packaged-native.txt)" -eq 4
          test "$(grep -c 'ARM aarch64' packaged-native.txt)" -eq 4
          test -f "$app_dir/resources/ffmpeg/LICENSE.txt"
          test -f "$app_dir/resources/ffmpeg/PROVENANCE.json"

      - name: Upload Linux ARM64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-release-arm64
          path: |
            client/release/linux/*.AppImage
            client/release/linux/*.deb
            client/release/linux/latest-linux*.yml
            client/release/linux/*.blockmap
          retention-days: 1

  # ─── Windows: NSIS .exe installer → client/release/windows/ ─────────────────
  build-windows:
    name: Build Windows
    needs: [quality, electron-e2e]
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build renderer + main process
        run: npm run build --workspace=client

      - name: Vendor LGPL FFmpeg
        run: npm run vendor:ffmpeg --workspace=client -- win32-x64

      - name: Rebuild native modules
        run: npm run rebuild:native --workspace=client

      - name: Verify Windows native binaries
        shell: pwsh
        run: |
          $nativeFiles = @(
            "node_modules/better-sqlite3/prebuilds/win32-x64.node",
            "node_modules/keytar/build/Release/keytar.node",
            "client/vendor/ffmpeg/win32-x64/ffmpeg.exe"
          )
          foreach ($nativeFile in $nativeFiles) {
            if (-not (Test-Path $nativeFile)) { throw "Missing native binary: $nativeFile" }
            # Read only the PE header: ffmpeg.exe is ~110 MB and does not need to be buffered.
            $stream = [System.IO.File]::OpenRead((Resolve-Path $nativeFile))
            try {
              $bytes = New-Object byte[] 1024
              $read = $stream.Read($bytes, 0, 1024)
              if ($read -lt 64 -or $bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) {
                throw "Not a Windows PE binary: $nativeFile"
              }
              $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
              if ($peOffset -lt 0 -or $peOffset + 6 -gt $read) { throw "Unreadable PE header: $nativeFile" }
              $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
              if ($machine -ne 0x8664) {
                throw ("Expected Windows x64 PE binary, found machine 0x{0:X4}: {1}" -f $machine, $nativeFile)
              }
            } finally { $stream.Dispose() }
            Write-Host "Verified Windows x64: $nativeFile"
          }

      - name: Verify FFmpeg is an LGPL build
        shell: pwsh
        run: |
          $dir = "client/vendor/ffmpeg/win32-x64"
          foreach ($required in @("$dir/LICENSE.txt", "$dir/PROVENANCE.json")) {
            if (-not (Test-Path $required)) { throw "Missing LGPL compliance file: $required" }
          }
          if (-not (Select-String -Path "$dir/LICENSE.txt" -Pattern 'LESSER GENERAL PUBLIC LICENSE' -Quiet)) {
            throw "Bundled FFmpeg licence text is not the LGPL."
          }
          # The configure line is embedded in the executable; a GPL build cannot ship.
          $configuration = (& "$dir/ffmpeg.exe" -version 2>&1 | Out-String)
          foreach ($flag in @('--enable-gpl', '--enable-nonfree', '--enable-libx264', '--enable-libx265')) {
            if ($configuration.Contains($flag)) { throw "FFmpeg was configured with $flag; only LGPL builds may ship." }
          }
          Write-Host "Verified LGPL FFmpeg for Windows."

      - name: Package Windows (.exe)
        run: npx electron-builder --config electron-builder.win.yml --publish never
        working-directory: client

      - name: Verify packaged Windows LGPL compliance artifacts
        shell: pwsh
        run: |
          $dir = "client/release/windows/win-unpacked/resources/ffmpeg"
          foreach ($required in @("$dir/ffmpeg.exe", "$dir/LICENSE.txt", "$dir/PROVENANCE.json")) {
            if (-not (Test-Path $required)) { throw "Missing packaged FFmpeg file: $required" }
          }
          Write-Host "Verified packaged LGPL FFmpeg resources."

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            client/release/windows/*.exe
            client/release/windows/latest.yml
            client/release/windows/*.blockmap
          retention-days: 1

  # Native builds avoid mixing Intel and Apple Silicon native modules or FFmpeg.
  build-macos:
    name: Build macOS (${{ matrix.arch }})
    needs: [quality, electron-e2e]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
            app-directory: mac
          - arch: arm64
            runner: macos-15
            app-directory: mac-arm64
    runs-on: ${{ matrix.runner }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install locked dependencies
        run: npm ci
      - name: Verify native runner architecture
        run: test "$(node -p 'process.arch')" = "${{ matrix.arch }}"
      - name: Cache native LGPL FFmpeg
        id: ffmpeg-cache
        uses: actions/cache/restore@v4
        with:
          path: client/vendor/ffmpeg/darwin-${{ matrix.arch }}
          key: ffmpeg-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('scripts/fetch-ffmpeg.mjs') }}
          restore-keys: ffmpeg-${{ runner.os }}-${{ matrix.arch }}-
      - name: Download verified source from quality gate
        uses: actions/download-artifact@v4
        with:
          name: ffmpeg-official-source
          path: client/vendor/ffmpeg/source
      - name: Build LGPL FFmpeg from pinned official source
        run: npm run vendor:ffmpeg --workspace=client -- darwin-${{ matrix.arch }}
      - name: Distribution license gate
        run: npm run check:licenses
      - name: Save verified native FFmpeg before application packaging
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: client/vendor/ffmpeg/darwin-${{ matrix.arch }}
          key: ${{ steps.ffmpeg-cache.outputs.cache-primary-key }}
      - name: Build renderer and main process
        run: npm run build --workspace=client
      - name: Rebuild native modules for Electron
        run: npm run rebuild:native --workspace=client -- --arch=${{ matrix.arch }}
      - name: Real native Electron security and SQLite checks
        run: npm run test:e2e --workspace=client -- electron-boundary.spec.ts
      - name: Stage ad-hoc signed macOS application
        working-directory: client
        run: npx electron-builder --config electron-builder.mac.yml --mac dir --${{ matrix.arch }} --publish never
      - name: Verify packaged architecture, signature and FFmpeg execution
        run: node scripts/verify-macos-package.mjs ${{ matrix.arch }}
      - name: Verify packaged Electron fuses
        run: node scripts/verify-electron-fuses.cjs "client/release/mac/${{ matrix.app-directory }}/KokoMovie.app/Contents/MacOS/KokoMovie"
      - name: Archive the verified macOS application as DMG and ZIP
        working-directory: client
        run: npx electron-builder --config electron-builder.mac.yml --prepackaged release/mac/${{ matrix.app-directory }}/KokoMovie.app --mac dmg zip --${{ matrix.arch }} --publish never
      - name: Stage corresponding FFmpeg source
        if: matrix.arch == 'arm64'
        run: cp client/vendor/ffmpeg/darwin-arm64/ffmpeg-8.1.2.tar.xz client/release/mac/
      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-release-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            client/release/mac/*.dmg
            client/release/mac/*.zip
            client/release/mac/*.blockmap
            client/release/mac/latest-mac.yml
            client/release/mac/ffmpeg-*.tar.xz
          retention-days: 3

  # This assembly gate also runs for workflow_dispatch, before any release tag exists.
  verify-artifacts:
    name: Verify complete release artifacts
    needs: [build-linux, package-linux-arm64, build-windows, build-macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install locked dependencies
        run: npm ci
      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: linux-release-*
          path: artifacts/linux
          merge-multiple: true
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: artifacts/windows
      - name: Download distinct macOS architecture artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: macos-release-*
          path: artifacts/macos
      - name: Validate files, hashes, versions, source and combined Mac metadata
        run: node scripts/prepare-release.mjs artifacts release-artifacts
      - name: Verify flat release checksum manifest
        working-directory: release-artifacts
        run: sha256sum --check SHA256SUMS.txt
      - name: Upload validated release
        uses: actions/upload-artifact@v4
        with:
          name: release-ready
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 3

  create-release:
    if: startsWith(github.ref, 'refs/tags/v')
    name: Publish GitHub Release
    needs: verify-artifacts
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download validated release
        uses: actions/download-artifact@v4
        with:
          name: release-ready
          path: artifacts
      - name: Verify downloaded release checksums
        working-directory: artifacts
        run: sha256sum --check SHA256SUMS.txt
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: artifacts/RELEASE_NOTES.md
          draft: false
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
