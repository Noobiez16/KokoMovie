appId: com.kokomovie.app
productName: KokoMovie
copyright: Copyright © 2026 KokoMovie Inc.
electronVersion: "43.4.1"
afterPack: build/after-pack.cjs

directories:
  buildResources: build
  output: release/mac

files:
  - dist/**/*
  - dist-electron/**/*
  - package.json

extraResources:
  - from: build/icons
    to: icons
  - from: vendor/ffmpeg/darwin-${arch}
    to: ffmpeg
    filter:
      - ffmpeg
      - LICENSE.txt
      - PROVENANCE.json

npmRebuild: false
asar: true
asarUnpack:
  - "**/*.node"
  - node_modules/better-sqlite3/**/*
  - node_modules/keytar/**/*
compression: normal

mac:
  artifactName: "${productName}-${version}-mac-${arch}.${ext}"
  target:
    - dmg
    - zip
  icon: build/icons/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  category: public.app-category.entertainment
  minimumSystemVersion: '12.0'
  # No Developer ID or Apple notarization credentials are configured. Explicit ad-hoc signing
  # keeps the arm64 runtime valid after fuses are changed; it does not confer publisher trust.
  identity: '-'
  notarize: false

dmg:
  sign: false
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

publish:
  provider: github
  owner: Noobiez16
  repo: KokoMovie
  releaseType: release
