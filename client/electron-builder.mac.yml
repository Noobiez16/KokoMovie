appId: com.kokomovie.app
productName: KokoMovie
copyright: Copyright © 2026 KokoMovie Inc.
electronVersion: "43.4.1"
afterPack: build/after-pack.cjs

directories:
  buildResources: build
  output: release/mac

files:
  - dist/**/*
  - dist-electron/**/*
  - package.json

extraResources:
  - from: build/icons
    to: icons

asar: true
asarUnpack:
  - "**/*.node"
  - node_modules/better-sqlite3/**/*
  - node_modules/keytar/**/*
compression: maximum

# NOTE: macOS remains build-only. BtbN publishes no macOS FFmpeg artifact, so no LGPL binary is
# vendored for darwin and torrent remuxing / download finalization are unavailable in a macOS
# build. Source and verify a macOS LGPL build before macOS leaves build-only status.

mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  icon: build/icons/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  category: public.app-category.entertainment
  # electron-builder 26 takes `notarize` as a boolean; the team is read from APPLE_TEAM_ID (or
  # APPLE_API_* / APPLE_KEYCHAIN_*) in the environment. macOS is build-only and unsigned, and no
  # Apple credentials exist in CI, so notarization stays off until macOS is properly released.
  notarize: false

dmg:
  sign: true
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

publish:
  provider: github
  owner: Noobiez16
  repo: KokoMovie
  releaseType: release
