appId: com.kokomovie.app
productName: KokoMovie
copyright: Copyright © 2026 KokoMovie Inc.
electronVersion: "43.4.1"
afterPack: build/after-pack.cjs

directories:
  buildResources: build
  output: release/linux

files:
  - dist/**/*
  - dist-electron/**/*
  - package.json

extraResources:
  - from: build/icons
    to: icons
  # LGPL FFmpeg is shipped as a standalone executable outside the asar archive so it can be
  # spawned directly, inspected, and replaced by the user (see docs/LEGAL.md).
  - from: vendor/ffmpeg/linux-${arch}
    to: ffmpeg
    filter:
      - ffmpeg
      - LICENSE.txt
      - PROVENANCE.json

npmRebuild: false
asar: true
asarUnpack:
  - "**/*.node"
  - node_modules/better-sqlite3/**/*
  - node_modules/keytar/**/*
compression: maximum

linux:
  artifactName: "${productName}-${version}-linux-${arch}.${ext}"
  target:
    - target: AppImage
    - target: deb
  icon: build/icons
  category: AudioVideo
  synopsis: Stream your favourite movies and TV shows

deb:
  afterInstall: build/postInstall.sh

publish:
  provider: github
  owner: Noobiez16
  repo: KokoMovie
  releaseType: release
