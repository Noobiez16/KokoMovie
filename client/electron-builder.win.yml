appId: com.kokomovie.app
productName: KokoMovie
copyright: Copyright © 2026 KokoMovie Inc.
electronVersion: "43.4.1"
afterPack: build/after-pack.cjs

directories:
  buildResources: build
  output: release/windows

files:
  - dist/**/*
  - dist-electron/**/*
  - package.json

extraResources:
  - from: build/icons
    to: icons
  # LGPL FFmpeg is shipped as a standalone executable outside the asar archive so it can be
  # spawned directly, inspected, and replaced by the user (see docs/LEGAL.md).
  - from: vendor/ffmpeg/win32-${arch}
    to: ffmpeg
    filter:
      - ffmpeg.exe
      - LICENSE.txt
      - PROVENANCE.json

npmRebuild: false
asar: false
compression: maximum

win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icons/icon.ico
  # electron-builder 26 has no `win.sign` key — that is the v27 spelling, and `win` is declared
  # with additionalProperties:false, so an unknown key invalidates the whole block. Releases are
  # deliberately unsigned (see docs/LEGAL.md); signExecutable:false skips code signing while
  # resedit still applies the icon and version metadata.
  signExecutable: false

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: KokoMovie
  artifactName: KokoMovie-Setup-${version}.exe

publish:
  provider: github
  owner: Noobiez16
  repo: KokoMovie
  releaseType: release
