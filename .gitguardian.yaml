# GitGuardian / ggshield configuration.
#
# KokoMovie stores no secrets in the repository. TMDB credentials are supplied by the user at
# runtime and held in the OS keychain; there is no backend, account system, or service credential
# to commit. The exclusions below are high-entropy values that are deliberately public and must
# stay in version control.
version: 2

secret:
  ignored-matches:
    # SHA-256 digests of the public BtbN LGPL FFmpeg release archives fetched by
    # scripts/fetch-ffmpeg.mjs. These are supply-chain integrity pins, not credentials: they are
    # published alongside the upstream artifacts, and both `npm run check:licenses` and
    # client/src/renderer/lib/ffmpeg-licensing.test.ts read them to prove the shipped binary is
    # the audited LGPL build. Removing or rotating them would silently disable that guarantee.
    - name: FFmpeg linux-x64 release archive SHA-256
      match: 8c8b2897f2a8093ae2d985f7f1867d218451d4c567c1b2437f86a7c73a950b9f
    - name: FFmpeg linux-arm64 release archive SHA-256
      match: 0c8716a94ac1fe22eb56e7a0cedd0f00c1d8fae712ec19973d679a7a87916743
    - name: FFmpeg win32-x64 release archive SHA-256
      match: 089e4169e93b2b3f3acbfced3c0704d24276a225641bdda04d796d28b07a2a38

    # Static UUID fixture asserting that the download-id schema accepts a well-formed UUID.
    - name: Download identifier test fixture UUID
      match: 2d05d7f0-44c8-4cd0-a474-d37549e5ea9c
